name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true

      # Throwaway database passwords, generated per run so none is committed.
      - name: Configure test database credentials
        run: |
          owner="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 24)"
          worker="$(openssl rand -hex 24)"
          echo "::add-mask::$owner"
          echo "::add-mask::$app"
          echo "::add-mask::$worker"
          {
            echo "POSTGRES_PASSWORD=$owner"
            echo "APP_DB_PASSWORD=$app"
            echo "WORKER_DB_PASSWORD=$worker"
            echo "MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:$owner@127.0.0.1:5432/marketing"
            echo "TEST_DATABASE_URL=postgresql+asyncpg://marketing_app:$app@127.0.0.1:5432/marketing_test"
            echo "TEST_WORKER_DATABASE_URL=postgresql+asyncpg://marketing_worker:$worker@127.0.0.1:5432/marketing_test"
            echo "TEST_MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:$owner@127.0.0.1:5432/marketing_test"
          } >> "$GITHUB_ENV"

      - name: Start Postgres and SeaweedFS
        run: docker compose up -d --wait

      - name: Wait for the SeaweedFS S3 port
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8333; then exit 0; fi
            sleep 2
          done
          echo "SeaweedFS S3 did not come up on port 8333" >&2
          exit 1

      # Local-only dummy values from docker/seaweedfs-s3.json; they open only the CI container.
      - name: Configure test media storage
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=localdev"
            echo "AWS_SECRET_ACCESS_KEY=localdev-password"
            echo "AWS_REGION=us-east-1"
            echo "AWS_S3_BUCKET=nrc-test-media"
            echo "AWS_ENDPOINT_URL_S3=http://127.0.0.1:8333"
            echo "S3_FORCE_PATH_STYLE=true"
          } >> "$GITHUB_ENV"

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Create the versioned test bucket
        run: uv run python -m scripts.create_local_bucket

      - name: Format
        run: uv run ruff format --check .

      - name: Lint (includes security rules)
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app tests migrations scripts

      - name: Migrations apply, match the models and have one head
        run: |
          uv run alembic upgrade head
          uv run alembic check
          test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Tests
        run: uv run pytest

  contract-types:
    name: Frontend types compile from the contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same generator the README gives the frontend; exact versions, nothing installed in the repo.
      - name: Generate TypeScript types and compile them
        run: |
          npx --yes openapi-typescript@7.4.4 contracts/openapi.json -o "$RUNNER_TEMP/schema.d.ts"
          npx --yes -p typescript@5.6.3 tsc --noEmit --strict "$RUNNER_TEMP/schema.d.ts"

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"

      - name: pip-audit on the locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit@2.10.0 -r requirements-audit.txt --require-hashes --disable-pip
