{{- range $component := list "api" "worker" "migrations" }}
{{- $sa := (index $.Values $component).serviceAccount }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  labels:
    {{- include "nrc.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if eq $component "migrations" }}
    {{- /* The job is a pre-install hook, so its account must exist before it runs. */}}
  {{- if not $sa.annotations }}
  annotations:
  {{- end }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
# No API token in the pod: the app never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}
